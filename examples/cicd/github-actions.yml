name: pickle-sentry

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pickle-sentry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan for unsafe pickle deserialization
        uses: Sun-Wukhan/pickle-sentry@main
        with:
          path: .
          fail-on: high
          exclude: "/tests/,/fixtures/"
