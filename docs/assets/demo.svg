<svg xmlns="http://www.w3.org/2000/svg" width="920" height="394" viewBox="0 0 920 394" role="img" aria-label="pickle-sentry demo terminal">
<rect x="0" y="0" width="920" height="394" rx="10" fill="#0d1117"/>
<rect x="0" y="0" width="920" height="38" rx="10" fill="#161b22"/>
<circle cx="22" cy="19" r="6" fill="#ff5f57"/>
<circle cx="42" cy="19" r="6" fill="#febc2e"/>
<circle cx="62" cy="19" r="6" fill="#28c840"/>
<text x="52" y="24" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#9da7b1">pickle-sentry — demo</text>
<text x="22" y="64" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="15.5" fill="#e6edf3" opacity="0">$ pip install pickle-sentry<animate attributeName="opacity" from="0" to="1" begin="0.40s" dur="0.01s" fill="freeze"/></text>
<text x="22" y="90" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="15.5" fill="#e6edf3" opacity="0">$ pickle-sentry examples/vulnerable<animate attributeName="opacity" from="0" to="1" begin="0.95s" dur="0.01s" fill="freeze"/></text>
<text x="22" y="116" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="15.5" fill="#9da7b1" opacity="0">  findings: 5 (max severity: critical)<animate attributeName="opacity" from="0" to="1" begin="1.50s" dur="0.01s" fill="freeze"/></text>
<text x="22" y="142" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="15.5" fill="#ff7b72" opacity="0">  [CRITICAL] HF-DATASETS-PANDAS-BUILDER  app.py:8  — CVE-2026-57845<animate attributeName="opacity" from="0" to="1" begin="2.05s" dur="0.01s" fill="freeze"/></text>
<text x="22" y="168" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="15.5" fill="#ffa657" opacity="0">  [HIGH] UNSAFE-DESERIALIZATION  app.py:12  (pickle.load)<animate attributeName="opacity" from="0" to="1" begin="2.60s" dur="0.01s" fill="freeze"/></text>
<text x="22" y="194" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="15.5" fill="#ffa657" opacity="0">  [HIGH] PANDAS-READ-PICKLE  app.py:13<animate attributeName="opacity" from="0" to="1" begin="3.15s" dur="0.01s" fill="freeze"/></text>
<text x="22" y="220" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="15.5" fill="#ffa657" opacity="0">  [HIGH] TORCH-LOAD-WEIGHTS-ONLY-FALSE  app.py:17<animate attributeName="opacity" from="0" to="1" begin="3.70s" dur="0.01s" fill="freeze"/></text>
<text x="22" y="246" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="15.5" fill="#ff7b72" opacity="0">  → exit 1 — the CI gate fails<animate attributeName="opacity" from="0" to="1" begin="4.25s" dur="0.01s" fill="freeze"/></text>
<text x="22" y="272" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="15.5" fill="#e6edf3" opacity="0">$ pickle-sentry examples/safe<animate attributeName="opacity" from="0" to="1" begin="4.80s" dur="0.01s" fill="freeze"/></text>
<text x="22" y="298" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="15.5" fill="#3fb950" opacity="0">  No unsafe deserialization patterns found. → exit 0<animate attributeName="opacity" from="0" to="1" begin="5.35s" dur="0.01s" fill="freeze"/></text>
<text x="22" y="324" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="15.5" fill="#e6edf3" opacity="0">$ pickle-sentry hub some-user/some-model --repo-type model<animate attributeName="opacity" from="0" to="1" begin="5.90s" dur="0.01s" fill="freeze"/></text>
<text x="22" y="350" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="15.5" fill="#9da7b1" opacity="0">  pickle stream inside pytorch_model.bin inspected — never executed<animate attributeName="opacity" from="0" to="1" begin="6.45s" dur="0.01s" fill="freeze"/></text>
<rect x="22" y="360" width="9" height="18" fill="#3fb950"><animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/></rect>
</svg>
